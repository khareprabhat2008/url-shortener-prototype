version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: dev-admin-token
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: python -m app.workers.analytics_worker
    volumes:
      - .:/app
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  orchestrator:
    build: .
    command: uvicorn orchestrator.main:app --host 0.0.0.0 --port 9000 --reload
    volumes:
      - .:/app
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: dev-admin-token
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
